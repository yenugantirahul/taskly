services:
  postgres:
    image: postgres:17
    container_name: minitrigger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minitrigger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minitrigger"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: minitrigger-mail
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (SMTP_URL in apps/server/.env)
      - "8025:8025" # Web UI: http://localhost:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    container_name: minitrigger-redis
    restart: unless-stopped
    # Cache only: nothing is written to disk
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379" # 6380 on the host: 6379 is often taken by other projects (REDIS_URL in apps/server/.env)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
